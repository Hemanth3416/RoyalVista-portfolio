<!-- 
    ROYALVISTA TECH SOLUTIONS - FAVICON & META TAGS
    Add this to the <head> section of your base template
-->

<!-- Primary Meta Tags -->
<title>{% block title %}RoyalVista Tech Solutions - Premium Digital Solutions{% endblock %}</title>
<meta name="title" content="RoyalVista Tech Solutions - Premium Digital Solutions">
<meta name="description"
    content="Premium Quality. Unmatched Speed. Professional web design, branding, video editing, SEO, and digital marketing services.">
<meta name="keywords"
    content="web design, logo design, video editing, SEO services, digital marketing, tech solutions, RoyalVista">
<meta name="author" content="RoyalVista Tech Solutions">
<meta name="robots" content="index, follow">

<!-- Favicon - Multiple Sizes -->
<link rel="icon" type="image/png" sizes="16x16"
    href="{{ url_for('static', filename='assets/branding/favicons/favicon-16x16.png') }}">
<link rel="icon" type="image/png" sizes="32x32"
    href="{{ url_for('static', filename='assets/branding/favicons/favicon-32x32.png') }}">
<link rel="icon" type="image/png" sizes="64x64"
    href="{{ url_for('static', filename='assets/branding/favicons/favicon-64x64.png') }}">
<link rel="apple-touch-icon" sizes="180x180"
    href="{{ url_for('static', filename='assets/branding/favicons/apple-touch-icon.png') }}">
<link rel="shortcut icon" href="{{ url_for('static', filename='assets/branding/favicons/favicon.ico') }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request.url }}">
<meta property="og:title" content="RoyalVista Tech Solutions - Premium Digital Solutions">
<meta property="og:description"
    content="Premium Quality. Unmatched Speed. Professional digital services for modern businesses.">
<meta property="og:image"
    content="{{ url_for('static', filename='assets/branding/social/og-image.png', _external=True) }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="RoyalVista Tech Solutions">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ request.url }}">
<meta name="twitter:title" content="RoyalVista Tech Solutions - Premium Digital Solutions">
<meta name="twitter:description"
    content="Premium Quality. Unmatched Speed. Professional digital services for modern businesses.">
<meta name="twitter:image"
    content="{{ url_for('static', filename='assets/branding/social/twitter-card.png', _external=True) }}">
<meta name="twitter:creator" content="@RoyalVista">

<!-- Theme Color (for mobile browsers) -->
<meta name="theme-color" content="#6C63FF">
<meta name="msapplication-TileColor" content="#6C63FF">
<meta name="msapplication-config" content="{{ url_for('static', filename='assets/branding/browserconfig.xml') }}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ request.url }}">

<!-- Web App Manifest (for PWA) -->
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
