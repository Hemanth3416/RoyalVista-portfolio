<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header {
            background: #0a0a1a;
            color: #ffffff;
            padding: 30px;
            text-align: center;
        }

        .content {
            padding: 30px;
            color: #333333;
            line-height: 1.6;
        }

        .footer {
            background: #f9f9f9;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #777777;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #00bcd4;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 20px;
        }

        .details {
            background: #f0f4f8;
            padding: 20px;
            border-radius: 4px;
            border-left: 4px solid #00bcd4;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>RoyalVista Tech Solutions</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            &copy; 2026 RoyalVista Tech Solutions. All rights reserved.<br>
            Innovative Digital & Creative Services.
        </div>
    </div>
</body>

</html>
